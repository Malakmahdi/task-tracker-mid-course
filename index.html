<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FocusBoard Task Tracker</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">FOCUSBOARD</p>
      <h1>Move work forward.</h1>
      <p class="subtitle">A focused Kanban board for the tasks that matter.</p>
    </div>
    <button id="new-task" class="primary">+ New task</button>
  </header>

  <main>
    <section class="toolbar" aria-label="Task filters">
      <label class="check-filter"><input id="overdue-filter" type="checkbox"> Overdue only</label>
      <label>Tag
        <select id="tag-filter">
          <option value="">All tags</option>
        </select>
      </label>
      <button id="clear-filters" class="ghost">Clear filters</button>
      <p id="result-count" aria-live="polite"></p>
    </section>

    <section id="board" class="board" aria-label="Kanban board">
      <section class="column" data-status="todo">
        <div class="column-heading"><span class="dot todo-dot"></span><h2>To do</h2><span class="count">0</span></div>
        <div class="task-list"></div>
      </section>
      <section class="column" data-status="in_progress">
        <div class="column-heading"><span class="dot progress-dot"></span><h2>In progress</h2><span class="count">0</span></div>
        <div class="task-list"></div>
      </section>
      <section class="column" data-status="done">
        <div class="column-heading"><span class="dot done-dot"></span><h2>Done</h2><span class="count">0</span></div>
        <div class="task-list"></div>
      </section>
    </section>
  </main>

  <dialog id="task-dialog">
    <form id="task-form">
      <div class="modal-heading">
        <div><p class="eyebrow">TASK DETAILS</p><h2 id="dialog-title">Create a task</h2></div>
        <button type="button" id="close-dialog" class="icon-button" aria-label="Close">×</button>
      </div>
      <input id="task-id" type="hidden">
      <label>Title <input id="title" maxlength="100" required placeholder="What needs to be done?"></label>
      <label>Description <textarea id="description" maxlength="500" rows="3" placeholder="Add helpful context"></textarea></label>
      <div class="form-grid">
        <label>Status
          <select id="status">
            <option value="todo">To do</option>
            <option value="in_progress">In progress</option>
            <option value="done">Done</option>
          </select>
        </label>
        <label>Priority
          <select id="priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </label>
      </div>
      <div class="form-grid">
        <label>Assignee <input id="assignee" maxlength="60" placeholder="Name"></label>
        <label>Due date <input id="due-date" type="date"></label>
      </div>
      <label>Tags <input id="tags" placeholder="frontend, course" aria-describedby="tag-help"></label>
      <small id="tag-help">Up to 5 comma-separated tags, 20 characters each.</small>
      <p id="form-error" class="error" role="alert"></p>
      <div class="actions">
        <button id="delete-task" type="button" class="danger hidden">Delete</button>
        <span></span>
        <button type="button" id="cancel-dialog" class="ghost">Cancel</button>
        <button type="submit" class="primary">Save task</button>
      </div>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
