name: CI

on:
  push:
    branches: [main, mid-course-project, final-project]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build image
        run: docker build -t task-tracker:final .
      - name: Verify non-root runtime
        run: test "$(docker run --rm task-tracker:final id -u)" != "0"
      - name: Run container
        run: docker run -d --name task-tracker-ci -p 8000:8000 task-tracker:final
      - name: Verify health endpoint
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs task-tracker-ci
          exit 1
      - name: Stop container
        if: always()
        run: |
          if docker ps --all --quiet --filter name=task-tracker-ci | grep --quiet .; then
            docker rm --force task-tracker-ci
          fi
